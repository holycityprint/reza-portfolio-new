<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect | Reza Respati</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;900&family=Fira+Code:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #D4D0C7; --text-main: #111; --text-sub: #444; --accent: #FF3333; }
        * { box-sizing: border-box; }
        @media (hover: hover) and (pointer: fine) { * { cursor: none; } }

        body { margin: 0; background: var(--bg-color); color: var(--text-main); font-family: 'Inter'; min-height: 100vh; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding-bottom: 50px; }
        
        .noise-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9998; opacity: 0.08; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); }
        
        .cursor-dot, .cursor-outline { display: none; }
        @media (hover: hover) and (pointer: fine) {
            .cursor-dot { display: block; position: fixed; width: 6px; height: 6px; background: var(--text-main); pointer-events: none; z-index: 10000; transform: translate(-50%, -50%); }
            .cursor-outline { display: block; position: fixed; width: 30px; height: 30px; border: 2px solid var(--text-main); pointer-events: none; z-index: 10000; transition: 0.1s; transform: translate(-50%, -50%); }
            body.hovering .cursor-outline { width: 50px; height: 50px; border-color: var(--accent); background: rgba(255, 51, 51, 0.1); }
        }

        .navbar { width: 90%; max-width: 1400px; padding-top: 40px; display: flex; justify-content: space-between; z-index: 10; opacity: 0; position: relative; }
        .nav-logo { font-family: 'Fira Code'; font-weight: 900; text-decoration: none; color: var(--text-main); } .nav-logo span { color: var(--accent); }
        .nav-menu { display: flex; gap: 50px; list-style: none; } .nav-menu a { font-family: 'Fira Code'; font-size: 0.9rem; text-decoration: none; color: var(--text-main); opacity: 0.7; transition: 0.2s; } .nav-menu a:hover, .nav-menu a.active { opacity: 1; color: var(--accent); text-decoration: underline; }

        .contact-layout { display: grid; grid-template-columns: 1fr 1fr; width: 85%; max-width: 1200px; margin-top: 150px; align-items: flex-start; gap: 80px; z-index: 2; }
        .info-col { display: flex; flex-direction: column; }
        .label-tag { font-family: 'Fira Code'; font-size: 0.7rem; color: var(--accent); margin-bottom: 15px; }
        h1 { font-size: 4.5rem; line-height: 0.9; margin: 0 0 40px 0; letter-spacing: -3px; font-weight: 900; }
        
        .contact-card { background: #fff; border: 2px solid var(--text-main); padding: 25px; margin-bottom: 20px; display: flex; flex-direction: column; transition: 0.2s; box-shadow: 8px 8px 0px rgba(0,0,0,0.1); text-decoration: none; opacity: 0; transform: translateX(-20px); cursor: pointer; }
        .contact-card:hover { transform: translate(-4px, -4px); box-shadow: 12px 12px 0px var(--accent); border-color: var(--text-main); }
        .c-title { font-family: 'Fira Code'; font-size: 0.7rem; color: var(--text-sub); margin-bottom: 5px; }
        .c-value { font-size: 1.2rem; font-weight: 700; color: var(--text-main); word-break: break-all; }

        .form-col { background: #DDD9CE; border: 2px solid var(--text-main); padding: 40px; box-shadow: 15px 15px 0px rgba(0,0,0,0.1); opacity: 0; transform: translateY(20px); }
        .form-header { font-family: 'Fira Code'; font-weight: bold; border-bottom: 2px solid var(--text-main); padding-bottom: 15px; margin-bottom: 30px; display: flex; justify-content: space-between; }
        .input-group { margin-bottom: 25px; }
        .input-label { font-family: 'Fira Code'; font-size: 0.8rem; color: var(--text-main); margin-bottom: 8px; display: block; }
        input, textarea { width: 100%; background: transparent; border: none; border-bottom: 2px solid #999; font-family: 'Inter'; font-size: 1rem; padding: 10px 0; color: var(--text-main); outline: none; transition: 0.3s; cursor: auto; }
        input:focus, textarea:focus { border-bottom-color: var(--accent); }
        .submit-btn { width: 100%; padding: 15px; background: var(--text-main); color: #fff; border: none; font-family: 'Fira Code'; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; text-transform: uppercase; letter-spacing: 1px; }
        .submit-btn:hover { background: var(--accent); box-shadow: 5px 5px 0px rgba(0,0,0,0.2); }

        /* MOBILE RESPONSIVE */
        @media (max-width: 900px) { 
            .navbar { flex-direction: column; padding-top: 20px; align-items: center; }
            .nav-menu { gap: 20px; margin-top: 15px; padding: 0; }
            
            .contact-layout { display: flex; flex-direction: column; margin-top: 60px; gap: 50px; }
            h1 { font-size: 3.5rem; }
            
            .form-col { padding: 25px; box-shadow: 8px 8px 0px rgba(0,0,0,0.1); }
        }
    </style>
</head>
<body>
    <div class="noise-overlay"></div>
    <div class="cursor-dot"></div><div class="cursor-outline"></div>

    <nav class="navbar">
        <a href="index.html" class="nav-logo" onmouseenter="hoverLink()" onmouseleave="leaveLink()">REZA<span>.PORTOFOLIO</span></a>
        <ul class="nav-menu">
            <li><a href="work.html" onmouseenter="hoverLink()" onmouseleave="leaveLink()">Work</a></li>
            <li><a href="about.html" onmouseenter="hoverLink()" onmouseleave="leaveLink()">About</a></li>
            <li><a href="notes.html" onmouseenter="hoverLink()" onmouseleave="leaveLink()">Notes</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

    <div class="contact-layout">
        <div class="info-col">
            <span class="label-tag">// TRANSMISSION_HUB</span>
            <h1>Let's Start<br>Protocol.</h1>
            <a href="mailto:reza.respati2285@gmail.com" class="contact-card" onmouseenter="hoverLink()" onmouseleave="leaveLink()">
                <span class="c-title">PRIMARY_MAIL</span><span class="c-value">reza.respati2285@gmail.com</span>
            </a>
            <a href="https://wa.me/6285724922172" target="_blank" class="contact-card" onmouseenter="hoverLink()" onmouseleave="leaveLink()">
                <span class="c-title">SECURE_LINE (WA)</span><span class="c-value">+62 857-2492-2172</span>
            </a>
        </div>
        <div class="form-col">
            <div class="form-header"><span>MSG_FORM.exe</span><span>v1.0</span></div>
            <form action="#" onsubmit="return false;">
                <div class="input-group"><label class="input-label">IDENTIFIER (NAME)</label><input type="text" placeholder="Enter your name" onmouseenter="hoverLink()" onmouseleave="leaveLink()"></div>
                <div class="input-group"><label class="input-label">RETURN_ADDRESS (EMAIL)</label><input type="email" placeholder="Enter your email" onmouseenter="hoverLink()" onmouseleave="leaveLink()"></div>
                <div class="input-group"><label class="input-label">PAYLOAD (MESSAGE)</label><textarea rows="3" placeholder="Type your message..." onmouseenter="hoverLink()" onmouseleave="leaveLink()"></textarea></div>
                <button class="submit-btn" onmouseenter="hoverLink()" onmouseleave="leaveLink()">INITIATE_SEND</button>
            </form>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script>
        const cursorDot = document.querySelector('.cursor-dot'), cursorOutline = document.querySelector('.cursor-outline');
        if (window.matchMedia("(hover: hover)").matches) {
            window.addEventListener('mousemove', e => { cursorDot.style.left = `${e.clientX}px`; cursorDot.style.top = `${e.clientY}px`; cursorOutline.animate({ left: `${e.clientX}px`, top: `${e.clientY}px` }, { duration: 200, fill: "forwards" }); });
        }
        function hoverLink() { document.body.classList.add('hovering'); } function leaveLink() { document.body.classList.remove('hovering'); }

        var tl = anime.timeline({ easing: 'easeOutExpo', duration: 1200 });
        tl.add({ targets: '.navbar', opacity: [0, 1], translateY: [-20, 0], duration: 1000 })
          .add({ targets: ['.label-tag', 'h1'], opacity: [0, 1], translateY: [20, 0], duration: 1000 }, '-=800')
          .add({ targets: '.contact-card', opacity: [0, 1], translateX: [-20, 0], delay: anime.stagger(100) }, '-=600')
          .add({ targets: '.form-col', opacity: [0, 1], translateY: [20, 0], duration: 1200 }, '-=1000');
    </script>
</body>
</html>
